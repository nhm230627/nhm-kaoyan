# 免费 iOS 编译通道
#
# 为什么存在这个文件：
#   1) 我们的开发机是 Windows，没有 xcodebuild / swift / xcrun，36 个 Swift 文件从未编译过；
#   2) GitHub 给 public 仓库的 macOS runner 完全免费、不限分钟；private 仓库 Free 计划
#      每月 2000 分钟按 10 倍扣，等于 200 分钟 macOS 时间，够编译 25 次以上，且超额只停不扣钱；
#   3) 这个工作流做两件事：① 在真正的 macOS 上编译一遍，把编译错误留在网页日志里；
#      ② 把 App 装进 iPhone 模拟器、逐 Tab 截图，把 PNG 作为 artifact 传回来。
#      第 ② 件是 2026-11-03 加的，因为它顺带回答了那个一直没人知道答案的问题：
#      「这 6000 多行代码到底能不能在屏幕上跑起来」——编译通过不等于能启动。
#      截图仍是静态图，不能点按钮；交互验收还得靠真机或 Mac 上的模拟器人工点。

name: iOS 编译检查  # 流水线名字，会显示在仓库的 Actions 标签页

on:
  push:
    branches: [main]  # 推到 main 就自动编译，改完代码不用做别的
  workflow_dispatch:  # 也支持在网页上手动点 Run workflow，不推代码也能跑一次
    inputs:
      only:  # 只截指定页面，把单轮验证压到 8 分钟内
        description: '只截这些页面，逗号分隔。页面名用 shot 名（world,roam,sortmap,quiz…），房间用 room-lib / room-diner / room-market / room-plaza。留空 = 全量（30 页，约 9 分钟）'
        required: false  # 不填就是空串，走全量
        default: ''  # 空串代表全量
      tests:  # 单元测试要不要跑
        description: '跑单元测试（约 1-2 分钟；只想看界面时关掉更快）'
        type: boolean  # 布尔开关
        default: true  # 默认跑，保持原行为

jobs:
  build:  # 唯一的一个任务：编译
    # 2026-11-03 排查记录（别再来回试镜像浪费时间）：
    #   连续三次在 macos-latest 上排队 15 分钟后被取消，注解是
    #   「The job was not acquired by Runner of type hosted even after multiple attempts」，
    #   并附带「macOS arm64 容量紧张」的提示；换成 macos-15-intel 后立刻失败，注解才说真话：
    #   「The job was not started because recent account payments have failed or your spending
    #   limit needs to be increased」。所以排队/换池都是表象，根因是私有仓库的 Actions 额度。
    #   办法只有三个：仓库改 public（公开仓库的 Actions 全免费、不限分钟）、充值或调高 spending
    #   limit、等下个计费周期额度重置。代码本身没动过。
    #   2026-11-04 补充：Intel 池（macos-15-intel）能编译，但它的 iOS 模拟器跑不了 RealityKit——
    #   run 70 全部 10 份崩溃日志都是同一处 SIGFPE（re::TextureManager::init，RealityKit 引擎初始化），
    #   含 3D 的页面（world/roam/companion 等）一启动即崩，截图全是主屏。截图必须回 arm64 池。
    #   当天 arm64 容量紧张时（排队 15 分钟被取消），可先只验证编译，截图等容量缓解再跑。
    runs-on: macos-latest  # GitHub 提供的真实 macOS 机器（Apple Silicon，RealityKit 可正常渲染）

    defaults:
      run:
        working-directory: app  # project.yml 在 app/ 目录下，所有命令都在这层执行

    steps:
      - uses: actions/checkout@v4  # 把仓库代码拉到这台 macOS 上

      - name: 打印环境信息  # 出错时第一件事就是看这一段，确认 Xcode 版本
        run: |
          sw_vers  # 看 macOS 版本，Xcode 26.6 需要 macOS Tahoe 26.x
          xcodebuild -version  # 看 Xcode 版本，决定了哪些 API 可用
          xcrun simctl list runtimes  # 看装了哪些模拟器运行时

      - name: 安装 XcodeGen  # 工程文件是 project.yml 生成的，不是手写的
        run: brew install xcodegen  # runner 有管理员权限，可以直接 brew

      - name: 生成 Xcode 工程  # 把 project.yml 变成 FuShiZhuan.xcodeproj
        run: xcodegen generate  # 生成失败会直接报错，通常是因为 yml 缩进或路径写错

      - name: 编译  # 核心步骤：验证代码能不能过编译，并产出模拟器用的 .app
        run: xcodebuild -project FuShiZhuan.xcodeproj -scheme FuShiZhuan -sdk iphonesimulator -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO SWIFT_COMPILATION_MODE=wholemodule build  # wholemodule 让整个模块一次编译完，所有文件的错误一次全报出来，避免改一批暴露一批；derivedDataPath 固定到 build/ 是为了后面能确定地找到 .app；CODE_SIGNING_ALLOWED=NO 跳过签名（模拟器不需要签名）

      - name: 挑一个可用的 iPhone 模拟器  # test 动作必须指定具体设备，generic destination 跑不了测试
        id: pick
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print([x['udid'] for k in sorted(d, reverse=True) for x in d[k] if x['name'].startswith('iPhone')][0])")  # 取最新运行时里的第一台 iPhone
          echo "选中的模拟器 UDID: $UDID"  # 打出来方便排查
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"  # 传给后面的步骤

      - name: 装进模拟器并逐 Tab 截图  # 这一步同时验证「App 能不能启动」——此前 6074 行代码从未上过屏幕
        if: always()  # 就算测试挂了也要截图：界面本身有问题时，图比测试日志更能说明情况
        run: |
          set -u  # 用到未定义变量就报错，避免路径写错后静默继续
          UDID="${{ steps.pick.outputs.udid }}"  # 复用前面挑好的模拟器
          APP="build/Build/Products/Debug-iphonesimulator/FuShiZhuan.app"  # 编译产物的固定路径
          mkdir -p shots  # 截图输出目录
          xcrun simctl boot "$UDID" || true  # 已在运行会报错，忽略
          xcrun simctl bootstatus "$UDID" -b || true  # 等到完全启动，避免装不上
          if [ ! -d "$APP" ]; then  # 产物不存在说明编译就没成
            echo "产物不存在：$APP" | tee shots/FAILED.txt  # 记下来
            exit 0  # 不判失败：编译步骤已经红过了，这里再红只会掩盖真正原因
          fi
          xcrun simctl install "$UDID" "$APP"  # 装到模拟器
          ONLY="${{ inputs.only }}"  # 快车道开关：留空即全量
          TABS="today quiz interview companion profile"  # 五个 Tab
          PAGES="avatar papers paper wrongbook run result sortmap sortplay diy mock tracksheet community post room ritual duel plaza world roam"  # 子页面
          ROOMS="lib diner market plaza"  # 漫游四间房
          if [ -n "$ONLY" ]; then  # 指定了就只截这些，把单轮压到 8 分钟内
            TABS=""; PAGES=""; ROOMS=""  # 先清空，再按名单装填
            for p in $(echo "$ONLY" | tr ',' ' '); do  # 逗号拆成空格逐个看
              case "$p" in  # 按前缀分流
                room-*) ROOMS="$ROOMS ${p#room-}" ;;  # room-lib 这种写法归到房间
                today|quiz|interview|companion|profile) TABS="$TABS $p" ;;  # 五个 Tab 单独走
                *) PAGES="$PAGES $p" ;;  # 其余一律当子页面
              esac
            done
          fi
          echo "本次截取 Tab=[$TABS] 子页面=[$PAGES] 房间=[$ROOMS]"  # 打出来核对名单
          for TAB in $TABS; do  # 五个 Tab 各来一次
            xcrun simctl terminate "$UDID" com.fushizhuan.app 2>/dev/null || true  # 先杀掉上一次，保证是冷启动
            echo "== 启动 $TAB =="  # 日志分隔
            xcrun simctl launch "$UDID" com.fushizhuan.app -startTab "$TAB" || echo "启动命令失败：$TAB"  # 启动参数由 RootView.initialTab 解析
            sleep 9  # 等首帧渲染完：RealityKit 冷启动要编着色器，6 秒会截到白屏（companion 白屏就是这么来的）
            xcrun simctl io "$UDID" screenshot "shots/$TAB.png" || echo "截图失败：$TAB"  # 截当前屏幕
          done
          for PAGE in $PAGES; do  # 子页面各来一张：这些页面点不进去，只能靠 -startShot 直接弹开
            xcrun simctl terminate "$UDID" com.fushizhuan.app 2>/dev/null || true  # 杀进程保证冷启动
            echo "== 子页面 $PAGE =="  # 日志分隔
            xcrun simctl launch "$UDID" com.fushizhuan.app -startTab quiz -startShot "$PAGE" || echo "启动失败：$PAGE"  # RootView.initialShot 解析
            sleep 8  # 等 3D 与列表渲染
            xcrun simctl io "$UDID" screenshot "shots/shot-$PAGE.png" || echo "截图失败：$PAGE"  # 存成 shot-<名字>.png
          done
          for ROOM in $ROOMS; do  # 漫游四间房各来一张，靠 -shotRoom 换场景
            xcrun simctl terminate "$UDID" com.fushizhuan.app 2>/dev/null || true  # 杀进程保证冷启动
            echo "== 漫游房间 $ROOM =="  # 日志分隔
            xcrun simctl launch "$UDID" com.fushizhuan.app -startTab quiz -startShot roam -shotRoom "$ROOM" || echo "启动失败：$ROOM"  # 房间 id 由 ShotRoamRoom 解析
            sleep 8  # 等 3D 家具铺完
            xcrun simctl io "$UDID" screenshot "shots/roam-$ROOM.png" || echo "截图失败：$ROOM"  # 存成 roam-<房间>.png
          done
          echo "== 崩溃日志 =="  # 如果启动即崩，真正的堆栈在这里
          cp ~/Library/Logs/DiagnosticReports/*.ips shots/ 2>/dev/null || echo "没有崩溃日志，说明启动过程没崩"  # 有就一起上传
          ls -la shots/  # 列出来，方便在日志里核对每张图的大小

      - name: 上传截图  # 让这些图能在网页上下载，不用去翻日志
        if: always()  # 同上，失败时更需要看图
        uses: actions/upload-artifact@v4
        with:
          name: app-screenshots  # artifact 名字，网页上按这个下载
          path: app/shots/  # 注意路径是相对仓库根目录，不是 working-directory
          if-no-files-found: warn  # 一张都没截到也不额外报错，日志里已写明原因

      # 顺序为什么把测试放在截图后面：
      #   2026-11-03 的 run 68 在「跑单元测试」这一步卡了 30 分钟不动，导致后面的截图与上传
      #   全部没机会执行，白等一轮。截图是看界面必需的东西，测试卡住不该拖累它，所以先截图、
      #   先上传，最后再跑测试。再加 timeout-minutes 兜底：卡住最多 15 分钟就被杀掉，job 能收尾。
      - name: 跑单元测试  # 只跑 build 只能证明"能编译"，跑 test 才能证明"逻辑对"
        if: ${{ github.event_name == 'push' || inputs.tests }}  # 手动触发时可关掉，只看界面就更快
        timeout-minutes: 15  # 卡死兜底：模拟器偶发 hang 时不至于把整个 job 拖到 6 小时上限
        run: xcodebuild test -project FuShiZhuan.xcodeproj -scheme FuShiZhuan -destination "id=${{ steps.pick.outputs.udid }}" CODE_SIGNING_ALLOWED=NO  # 目标设备由上一步动态挑，避免写死机型名导致找不到模拟器
