# XcodeGen 工程描述文件
#
# 为什么用 XcodeGen 而不是手写 .xcodeproj：
# 1) project.pbxproj 是二进制的结构化文本，手写无法在 Windows 上验证，一旦打不开就是白费时间；
# 2) 用 YAML 描述工程，加文件、改配置都是改文本，可 review、可 diff、可回滚；
# 3) 换机器只要 `xcodegen generate` 一条命令，不依赖某个人电脑上的工程文件。
#
# 在 Mac 上执行：
#   brew install xcodegen
#   cd D:\APP\app  →  xcodegen generate
#   open FuShiZhuan.xcodeproj

name: FuShiZhuan

options:
  bundleIdPrefix: com.fushizhuan
  deploymentTarget:
    iOS: "18.0"     # 3D 伙伴用的 generateCylinder 是 iOS 18 才有的 API；
                    # iOS 18 与 iOS 17 支持的机型完全相同（iPhone XR / XS 及之后），
                    # 所以抬高到 18 实际放弃的只是「不愿升级系统的极少数用户」，代价极小。
                    # 若以后必须回到 iOS 17，就得把 PetSceneView 里的圆柱换成方块近似。
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""          # 在 Xcode 里选自己的 Team，或在这里填 Team ID
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    # 主题色，供 AccentColor 使用
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

targets:
  FuShiZhuan:
    type: application
    platform: iOS
    sources:
      - path: FuShiZhuan
        excludes:
          - "**/.DS_Store"
          # 隐私清单单独声明成资源，先从目录扫描里排除，避免同一文件被收两次
          - "Resources/PrivacyInfo.xcprivacy"
      # 苹果要求 PrivacyInfo.xcprivacy 必须位于 App 包根目录，
      # 显式指定 buildPhase: resources 才能保证它被拷进 Bundle 而不是被按未知类型忽略。
      - path: FuShiZhuan/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fushizhuan.app
        # 产物名（.app 包名与可执行文件名）保持 ASCII。
        # 之前写成「复试专」，导致生成的包是 复试专.app，而 XcodeGen 给测试 target 配的
        # TEST_HOST 是按 target 名拼的 FuShiZhuan.app/FuShiZhuan，路径对不上就跑不了测试。
        # 非 ASCII 的产物名对签名脚本、CI 打包也是隐患，所以这里一律用 FuShiZhuan。
        # 用户看到的名字由下面 info.properties 里的 CFBundleDisplayName 决定，仍是「复试专」。
        PRODUCT_NAME: FuShiZhuan
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"       # 仅 iPhone，先把手机做透
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
    # Info.plist 由 XcodeGen 生成，下面的 key 全部写进 plist。
    # 不要同时开 GENERATE_INFOPLIST_FILE，否则两套 plist 会打架。
    info:
      path: FuShiZhuan/Resources/Info.plist
      properties:
        CFBundleDisplayName: 复试专
        UILaunchScreen: {}
        UIUserInterfaceStyle: Automatic
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # 阶段 3 语音作答必需，提前声明，避免上线前临时改工程重新审核
        NSMicrophoneUsageDescription: 用于模拟面试的语音作答，录音只在本机处理，不上传服务器。
        NSSpeechRecognitionUsageDescription: 用于把你的回答转成文字，语音不会被保存或上传。
        # BFF 服务地址。模拟器填 127.0.0.1 即可；真机必须换成 Mac 的局域网 IP（如 http://192.168.1.5:4318）
        # 上线前换成 https 域名，App Transport Security 要求 HTTPS，HTTP 只用于本地调试
        BFFBaseURL: http://127.0.0.1:4318
        # 客户端令牌，必须与 server 的 SERVICE_TOKEN 完全一致，不一致会一律 401
        # 注意：这是开发期固定令牌，能从安装包里读出来，上线前必须换成登录后下发的短期用户令牌
        BFFServiceToken: dev-token-change-me
        # true = 全部走本地 Mock（不联网、不烧额度、只验界面）；false = 走真实 BFF
        UseMockService: false
        # 只用了系统 HTTPS 加密，不属于需要提交出口合规证明的情形
        ITSAppUsesNonExemptEncryption: false

  # 单元测试包。
  # 为什么要它：本机没有 Xcode，只能靠 CI 验证。只跑 build 只能证明「能编译」，
  # 跑 test 才能证明「逻辑对」——权益额度、饥饿结算、离线评分、状态机、存档往返。
  # 测试同样跑在 GitHub 免费的 macOS 机器上，不额外花钱。
  FuShiZhuanTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FuShiZhuanTests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: FuShiZhuan          # 依赖主 target，XcodeGen 会自动配好 TEST_HOST 与 BUNDLE_LOADER
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fushizhuan.app.tests
        GENERATE_INFOPLIST_FILE: YES   # 测试包不需要自定义 plist，让 Xcode 自己生成

schemes:
  FuShiZhuan:
    build:
      targets:
        FuShiZhuan: all
        FuShiZhuanTests: [test]     # 只在跑测试时才编译测试包，正常构建不受影响
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FuShiZhuanTests           # 声明测试目标，xcodebuild test 才知道要跑谁
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

configs:
  Debug: debug
  Release: release
